name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending migrations to the linked production Supabase project"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate migration files exist
        shell: bash
        run: |
          test -d supabase/migrations
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0
          echo "Migration files found."
      - name: Check whether deployment is requested
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$APPLY_MIGRATIONS" == "true" ]]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
            echo "Manual run selected validation only; migrations were not applied."
          fi
      - name: Set up Supabase CLI
        if: steps.gate.outputs.requested == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations when repository secrets are configured
        if: steps.gate.outputs.requested == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::notice::Supabase deployment skipped. Configure SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, and SUPABASE_DB_PASSWORD in repository Actions secrets."
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes
