name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main] # Ganti dengan nama branch utama Anda (misal: master atau main)

  # Mengizinkan menjalankan workflow ini secara manual dari tab Actions
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://hanschoco:$HF_TOKEN@huggingface.co/spaces/hanschoco/AIKEPRIBADIAN main
