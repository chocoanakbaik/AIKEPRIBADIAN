name: AI Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend JavaScript syntax
        run: |
          node --check netlify/functions/chat.js
          node --check netlify/functions/memory.js
          node --check netlify/functions/core/retrieval.mjs
          node --check public/auth.js
      - name: Check inline frontend JavaScript
        run: node scripts/check-inline-scripts.mjs
      - name: Validate knowledge data
        run: node scripts/validate-knowledge.mjs
      - name: Validate database migration security and SQL delimiters
        run: node scripts/validate-migrations.mjs
      - name: Run retrieval unit tests
        run: node --test tests/*.test.mjs
      - name: Evaluate retrieval baseline
        run: node scripts/evaluate-retrieval.mjs
      - name: Smoke-test repository configuration and real knowledge corpus
        run: node scripts/smoke-check.mjs
